# 每 3 天自動連一次資料庫和網站：
# 1. 讓 Supabase 免費專案不會因為 7 天沒人用而休眠
# 2. 連不上時這個流程會失敗，GitHub 會自動寄信通知 repo 擁有者
name: 保活與健康檢查
on:
  schedule:
    - cron: "17 1 */3 * *"   # 每 3 天台北時間 09:17
  workflow_dispatch: {}       # 也可以在 Actions 頁面手動執行

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 讀取網站設定
        run: |
          echo "SB_URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.js)" >> "$GITHUB_ENV"
          echo "SB_KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' config.js)" >> "$GITHUB_ENV"
      - name: 資料庫
        run: |
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' "$SB_URL/rest/v1/settings?select=key&key=eq.team_name" -H "apikey: $SB_KEY")
          cat /tmp/r.json; echo
          if [ "$code" != "200" ]; then echo "::error::資料庫回應 $code，可能已休眠或設定有誤。到 Supabase 後台檢查，休眠的話按 Restore。"; exit 1; fi
      - name: 登入服務
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SB_URL/auth/v1/settings" -H "apikey: $SB_KEY")
          if [ "$code" != "200" ]; then echo "::error::登入服務回應 $code"; exit 1; fi
      - name: 網站
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/")
          if [ "$code" != "200" ]; then echo "::error::網站回應 $code"; exit 1; fi
